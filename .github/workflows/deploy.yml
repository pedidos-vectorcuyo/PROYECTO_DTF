name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vector-cuyo-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd vector-cuyo-frontend
          npm ci

      - name: Build application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_PRICES_ENDPOINT: ${{ secrets.VITE_API_PRICES_ENDPOINT }}
          VITE_API_UPLOAD_ORDER_ENDPOINT: ${{ secrets.VITE_API_UPLOAD_ORDER_ENDPOINT }}
          VITE_API_LOGIN_ENDPOINT: ${{ secrets.VITE_API_LOGIN_ENDPOINT }}
          VITE_API_REGISTER_ENDPOINT: ${{ secrets.VITE_API_REGISTER_ENDPOINT }}
          VITE_API_GET_ORDERS_ENDPOINT: ${{ secrets.VITE_API_GET_ORDERS_ENDPOINT }}
          VITE_API_GOOGLE_LOGIN_ENDPOINT: ${{ secrets.VITE_API_GOOGLE_LOGIN_ENDPOINT }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          cd vector-cuyo-frontend
          npm run build
          echo "Deploy from GitHub Actions Run $GITHUB_RUN_NUMBER at $(date)" > dist/deploy-info.txt

      - name: List build files for debug
        run: ls -R vector-cuyo-frontend/dist/

      - name: 🚀 Deploy to branch for Hostinger
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vector-cuyo-frontend/dist
          publish_branch: hostinger-dist
          force_orphan: true
          commit_message: "Automated Deployment from CI - ${{ github.sha }}"
