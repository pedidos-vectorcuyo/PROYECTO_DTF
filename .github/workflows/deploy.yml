name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vector-cuyo-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd vector-cuyo-frontend
          npm ci

      - name: Build application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_PRICES_ENDPOINT: ${{ secrets.VITE_API_PRICES_ENDPOINT }}
          VITE_API_UPLOAD_ORDER_ENDPOINT: ${{ secrets.VITE_API_UPLOAD_ORDER_ENDPOINT }}
          VITE_API_LOGIN_ENDPOINT: ${{ secrets.VITE_API_LOGIN_ENDPOINT }}
          VITE_API_REGISTER_ENDPOINT: ${{ secrets.VITE_API_REGISTER_ENDPOINT }}
          VITE_API_GET_ORDERS_ENDPOINT: ${{ secrets.VITE_API_GET_ORDERS_ENDPOINT }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          cd vector-cuyo-frontend
          npm run build

      - name: List build files for debug
        run: ls -R vector-cuyo-frontend/dist/

      - name: Deploy to Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          # Usamos variables de entorno directamente dentro de lftp para evitar problemas de parsing en la línea de comandos
          lftp -e "set ftp:ssl-allow no; set ftp:ssl-force no; set ftp:passive-mode true; set net:timeout 10; set net:max-retries 2; open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER; ls public_html; mirror -R --delete --verbose --exclude-glob .git* vector-cuyo-frontend/dist/ public_html; quit"
