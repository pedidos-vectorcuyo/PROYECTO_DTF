name: Deploy to Hostinger
# Trigger: Clean deployment verification

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vector-cuyo-frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd vector-cuyo-frontend
          npm ci
      
      - name: Build application
        run: |
          cd vector-cuyo-frontend
          npm run build
      
      - name: Deploy to Hostinger via FTP
        run: |
          # Install lftp
          sudo apt-get update
          sudo apt-get install -y lftp
          
          # Deploy only dist contents to public_html
          lftp -c "
          set ssl:verify-certificate no;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          mirror --reverse --delete --verbose --exclude-glob .git* \
                 vector-cuyo-frontend/dist/ /public_html/;
          "
