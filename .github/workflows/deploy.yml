name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vector-cuyo-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd vector-cuyo-frontend
          npm ci

      - name: Build application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_PRICES_ENDPOINT: ${{ secrets.VITE_API_PRICES_ENDPOINT }}
          VITE_API_UPLOAD_ORDER_ENDPOINT: ${{ secrets.VITE_API_UPLOAD_ORDER_ENDPOINT }}
          VITE_API_LOGIN_ENDPOINT: ${{ secrets.VITE_API_LOGIN_ENDPOINT }}
          VITE_API_REGISTER_ENDPOINT: ${{ secrets.VITE_API_REGISTER_ENDPOINT }}
          VITE_API_GET_ORDERS_ENDPOINT: ${{ secrets.VITE_API_GET_ORDERS_ENDPOINT }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          cd vector-cuyo-frontend
          npm run build
          echo "Deploy from GitHub Actions Run $GITHUB_RUN_NUMBER at $(date)" > dist/deploy-info.txt

      - name: List build files for debug
        run: ls -R vector-cuyo-frontend/dist/

      - name: 📂 Deploy to Hostinger via FTP Action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: vector-cuyo-frontend/dist/
          server-dir: /
          port: 21
          # Run 75: FTP home IS public_html web root, using / to upload directly there

