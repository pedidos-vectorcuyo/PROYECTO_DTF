name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vector-cuyo-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd vector-cuyo-frontend
          npm ci

      - name: Build application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_PRICES_ENDPOINT: ${{ secrets.VITE_API_PRICES_ENDPOINT }}
          VITE_API_UPLOAD_ORDER_ENDPOINT: ${{ secrets.VITE_API_UPLOAD_ORDER_ENDPOINT }}
          VITE_API_LOGIN_ENDPOINT: ${{ secrets.VITE_API_LOGIN_ENDPOINT }}
          VITE_API_REGISTER_ENDPOINT: ${{ secrets.VITE_API_REGISTER_ENDPOINT }}
          VITE_API_GET_ORDERS_ENDPOINT: ${{ secrets.VITE_API_GET_ORDERS_ENDPOINT }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          cd vector-cuyo-frontend
          npm run build
          echo "Deploy from GitHub Actions Run $GITHUB_RUN_NUMBER at $(date)" > dist/deploy-info.txt

      - name: List build files for debug
        run: ls -R vector-cuyo-frontend/dist/

      - name: 🧹 Clean old files on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 167.88.35.13
          port: 65002
          username: u501128802
          password: ${{ secrets.SSH_PASSWORD }}
          script: rm -rf /home/u501128802/domains/vectorcuyo.com/public_html/*

      - name: 📂 Deploy via SSH/SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 167.88.35.13
          port: 65002
          username: u501128802
          password: ${{ secrets.SSH_PASSWORD }}
          source: "vector-cuyo-frontend/dist/"
          target: "/home/u501128802/domains/vectorcuyo.com/public_html"
          strip_components: 2
          # Run 79: SSH/SCP replacing FTP - avoids Hostinger FTP rate limiting
