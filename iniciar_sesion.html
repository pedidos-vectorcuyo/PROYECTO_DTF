<div class="vc-card">
    <h2 style="text-align:center; color:#111827; margin-bottom:20px;">Acceso Clientes</h2>

    <form onsubmit="event.preventDefault(); doLogin();">
        <label style="display:block; margin-bottom:5px; font-weight:bold;">Email</label>
        <input type="email" id="login-email" class="vc-input" placeholder="tu@email.com" required>

        <label style="display:block; margin-bottom:5px; font-weight:bold;">Contraseña</label>

        <div class="vc-password-wrapper">
            <input type="password" id="login-pass" class="vc-input" placeholder="••••••••" required>
            <span class="vc-eye-icon" onclick="toggleLoginPass(this)">👁️</span>
        </div>

        <button type="submit" id="btn-login" class="vc-btn vc-btn-primary" style="margin-top: 20px;">INGRESAR</button>
    </form>

    <div style="margin-top:20px; text-align:center; font-size:0.9em; line-height: 2em;">
        ¿No tienes cuenta? <a href="/register" style="color:#2563eb; font-weight:bold; text-decoration:none;">Regístrate
            aquí</a>
        <br>
        <a href="/password-reset" style="color:#6b7280; text-decoration:none;">Olvidé mi contraseña</a>
    </div>

    <div id="login-msg" style="text-align:center; margin-top:10px; color:#dc2626;"></div>
</div>
