<div class="vc-card">
    <h2 style="text-align:center; color:#111827; margin-bottom:20px;">Recuperar Contraseña</h2>

    <p style="text-align:center; color:#6b7280; font-size:0.9em; margin-bottom:20px;">
        Ingresa tu email y te enviaremos tus datos de acceso.
    </p>

    <form id="form-reset">
        <label style="display:block; margin-bottom:5px; font-weight:bold;">Email registrado</label>
        <input type="email" id="reset-email" class="vc-input" placeholder="tu@email.com" required>

        <button type="submit" id="btn-reset" class="vc-btn vc-btn-primary" style="margin-top:15px;">RECUPERAR</button>
    </form>

    <div id="reset-msg" style="text-align:center; margin-top:15px; font-weight:bold;"></div>

    <div style="margin-top:20px; text-align:center; font-size:0.9em;">
        <a href="/log-in" style="color:#2563eb; text-decoration:none;">Volver a Iniciar Sesión</a>
    </div>
</div>
