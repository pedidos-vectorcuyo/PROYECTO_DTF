<div class="vc-layout">
    
    <div class="vc-left-panel">
        
        <div class="vc-temp-form">
            <h3 style="margin-top:0;">👤 Datos del Cliente</h3>
            <div class="vc-row">
                <input type="text" id="vc-cliente" class="vc-input" placeholder="Nombre" readonly>
                <input type="tel" id="vc-telefono" class="vc-input" placeholder="WhatsApp" readonly>
                <input type="email" id="vc-email" class="vc-input" placeholder="Email" readonly>
            </div>
        </div>

        <div class="vc-upload-card">
            <div id="vc-dropzone" class="vc-dropzone-area">
                <span style="font-size: 2em; margin-bottom: 10px;">📤</span>
                <span style="font-weight: bold; font-size: 1.1em;">Haz clic o arrastra tus archivos aquí</span>
                <span style="font-size: 0.9em; color: #666; margin-top: 5px;">Solo PNG, Fondo Transparente</span>
            </div>
            <input type="file" id="vc-archivo" multiple accept="image/png" style="display:none;">
        </div>

        <div id="vc-files-container"></div>
        
        <div id="vc-loading" style="display:none; text-align:center; padding:20px; color:#2563eb; font-weight:bold;">
            ⚡ Analizando dimensiones...
        </div>

        <div style="margin-top: 20px;">
            <label style="font-weight:bold; display:block; margin-bottom:5px;">📝 Observaciones</label>
            <textarea id="vc-observaciones" class="vc-input" rows="3" placeholder="Ej: Cortar individualmente, agrupar por tallas..."></textarea>
        </div>
    </div>

    <div class="vc-right-panel">
        <div class="vc-summary-card">
            <h3 style="margin-top:0;">Resumen del Pedido</h3>
            
            <div id="vc-summary-list" class="vc-summary-list">
                <div style="color:#999; text-align:center; padding:20px;">No hay archivos cargados.</div>
            </div>

            <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">

            <div id="vc-ticket-section" style="display:none;">
                <div class="vc-summary-row" style="color:#666; margin-bottom:5px;">
                    <span>Subtotal</span>
                    <span id="vc-ticket-subtotal">$0.00</span>
                </div>
                <div class="vc-summary-row discount" id="vc-row-discount" style="display:none; margin-bottom:5px;">
                    <span>Ahorro Mayorista 🎉</span>
                    <span id="vc-ticket-discount">-$0.00</span>
                </div>
                <div style="border-top: 1px dashed #ccc; margin: 10px 0;"></div>
            </div>

            <div class="vc-summary-row total">
                <span>TOTAL</span>
                <span id="vc-summary-total">$0.00</span>
            </div>

            <div style="text-align:center; margin-top:10px;">
                <div style="color:#444;">Metros: <strong id="vc-metros-totales">0.00</strong> m</div>
                <div id="vc-price-badge" class="vc-price-badge">Precio Base</div>
            </div>

            <div style="margin-top:20px;">
                <button type="button" id="vc-btn-ingresar" class="vc-btn-main" disabled>CONFIRMAR ORDEN</button>
            </div>
            <div id="vc-status-message" style="margin-top:10px; font-size:0.85em; text-align:center; color:#dc2626;"></div>
        </div>
    </div>
</div>

<div id="vc-modal-warn" class="vc-modal-overlay">
    <div class="vc-modal-content">
        <h3 style="margin-top:0;">⚠️ Atención</h3>
        <p id="vc-warn-msg" style="color:#4b5563; margin:15px 0;"></p>
        <div class="vc-modal-actions">
            <button id="vc-warn-cancel" class="vc-btn-secondary">Cancelar</button>
            <button id="vc-warn-accept" class="vc-btn-main ready" style="margin-top:0; width:auto;">Continuar</button>
        </div>
    </div>
</div>
