<div class="vc-card">
    <h2 style="text-align:center; color:#111827; margin-bottom:20px;">Crear Cuenta Nueva</h2>

    <form onsubmit="event.preventDefault(); doRegister();">
        <label style="font-weight:bold; display:block; margin-bottom:5px;">Nombre Completo</label>
        <input type="text" id="reg-nombre" class="vc-input" required>

        <label style="font-weight:bold; display:block; margin-bottom:5px;">Email</label>
        <input type="email" id="reg-email" class="vc-input" required>

        <label style="font-weight:bold; display:block; margin-bottom:5px;">WhatsApp</label>
        <input type="tel" id="reg-tel" class="vc-input" placeholder="Ej: 2604..." required>

        <label style="font-weight:bold; display:block; margin-bottom:5px;">Contraseña</label>
        <div class="vc-password-wrapper">
            <input type="password" id="reg-pass" class="vc-input" required>
            <span class="vc-eye-icon" onclick="toggleRegPass('reg-pass', this)">👁️</span>
        </div>

        <label style="font-weight:bold; display:block; margin-bottom:5px;">Repetir Contraseña</label>
        <div class="vc-password-wrapper">
            <input type="password" id="reg-pass-confirm" class="vc-input" required>
            <span class="vc-eye-icon" onclick="toggleRegPass('reg-pass-confirm', this)">👁️</span>
        </div>

        <div id="pass-error">❌ Las contraseñas no coinciden.</div>

        <button type="submit" id="btn-reg" class="vc-btn vc-btn-primary" style="margin-top:10px;">REGISTRARME</button>
    </form>

    <div style="margin-top:20px; text-align:center;">
        <a href="/log-in" style="color:#2563eb; text-decoration:none;">Ya tengo cuenta</a>
    </div>

    <div id="reg-msg" style="text-align:center; margin-top:10px; color:#dc2626;"></div>
</div>
