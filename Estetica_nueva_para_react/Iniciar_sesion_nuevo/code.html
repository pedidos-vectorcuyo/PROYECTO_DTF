<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Workstation B2B - Vector Cuyo</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1D4ED8",
                        "off-white": "#F7F8FA",
                        "surface": "#FFFFFF",
                        "gray-border": "#E6E8EC",
                        "text-main": "#0F172A",
                        "text-secondary": "#64748B",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "card": "12px",
                    },
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-sans antialiased text-text-main bg-off-white min-h-screen flex items-center justify-center p-4;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body>
<div class="w-full max-w-[400px] bg-surface border border-gray-border rounded-card p-8 shadow-sm">
<div class="flex flex-col items-center mb-8">
<div class="flex items-center gap-2 mb-6">
<div class="w-6 h-6 bg-text-main rounded flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[16px]">precision_manufacturing</span>
</div>
<span class="font-bold text-sm tracking-tight text-text-main">Vector<span class="text-primary">Cuyo</span></span>
</div>
<h1 class="text-[24px] font-bold text-text-main text-center leading-tight">Iniciar Sesión</h1>
<p class="text-[14px] text-text-secondary text-center mt-2 leading-relaxed">Ingresa a tu cuenta corporativa para gestionar pedidos</p>
</div>
<form class="space-y-5">
<div class="space-y-1.5">
<label class="block text-[13px] font-medium text-text-main" for="email">Email corporativo</label>
<input class="w-full h-[44px] bg-white border border-gray-border rounded-lg px-3.5 text-[14px] text-text-main placeholder-text-secondary/60 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="email" placeholder="nombre@empresa.com" type="email"/>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block text-[13px] font-medium text-text-main" for="password">Contraseña</label>
<a class="text-[12px] font-medium text-primary hover:text-[#1e40af] transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<input class="w-full h-[44px] bg-white border border-gray-border rounded-lg pl-3.5 pr-10 text-[14px] text-text-main placeholder-text-secondary/60 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-main transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<button class="w-full h-[48px] bg-primary hover:bg-[#1e40af] text-white rounded-full font-bold text-[14px] tracking-wide transition-all active:scale-[0.98] shadow-sm mt-2">
                Acceder al Workstation
            </button>
</form>
<div class="mt-8 pt-6 border-t border-gray-border text-center">
<span class="text-[13px] text-text-secondary">¿No tienes cuenta?</span>
<a class="text-[13px] font-bold text-primary hover:text-[#1e40af] ml-1 transition-colors" href="#">Crear cuenta B2B</a>
</div>
</div>

</body></html>
