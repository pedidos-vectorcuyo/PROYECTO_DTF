<script>
    // 1. SEGURIDAD: VERIFICAR SESIÓN
    const userSession = localStorage.getItem('dtf_user');
    if (!userSession) {
        window.location.href = '/log-in'; // Redirige si no hay usuario
    }

    // Convertimos el texto guardado a objeto real para usarlo
    const currentUser = JSON.parse(userSession || '{}');

    // 2. FUNCIÓN CERRAR SESIÓN
    function logout() {
        localStorage.removeItem('dtf_user');
        window.location.href = '/log-in';
    }

    // 3. RESALTAR PÁGINA ACTIVA
    const currentPath = window.location.pathname;
    if (currentPath.includes('panel-de-pedidos')) document.querySelector('a[href*="panel-de-pedidos"]').classList.add('active');
    if (currentPath.includes('pedidos')) document.querySelector('a[href*="pedidos"]').classList.add('active');
    if (currentPath.includes('profile')) document.querySelector('a[href*="profile"]').classList.add('active');
</script>

<div class="vc-card">
    <h3>Mis Datos</h3>
    <div style="margin-bottom:15px;">
        <label>Nombre</label>
        <input type="text" id="prof-nombre" class="vc-input" readonly>
    </div>
    <div style="margin-bottom:15px;">
        <label>Email (Usuario)</label>
        <input type="text" id="prof-email" class="vc-input" readonly style="background:#f3f4f6;">
    </div>
    <div style="margin-bottom:15px;">
        <label>WhatsApp</label>
        <input type="text" id="prof-whatsapp" class="vc-input" readonly>
    </div>
    <p style="font-size:0.8em; color:#666;">Para editar tus datos, por favor contáctanos.</p>
</div>

<script>
    // Rellenar datos desde la sesión local
    document.addEventListener("DOMContentLoaded", function () {
        if (currentUser) {
            document.getElementById('prof-nombre').value = currentUser.nombre || '';
            document.getElementById('prof-email').value = currentUser.correo || '';
            document.getElementById('prof-whatsapp').value = currentUser.whatsapp || '';
        }
    });
</script>
